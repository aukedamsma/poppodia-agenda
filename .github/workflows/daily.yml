name: Agenda bijwerken

on:
  schedule:
    - cron: "0 5 * * *"      # dagelijks 07:00 Nederlandse zomertijd (06:00 wintertijd)
  workflow_dispatch:          # handmatig starten via de Actions-tab
  push:
   branches: [main]
   paths: ["venues.yaml", "fetch.py", "build.py", "template.html"]

permissions:
  contents: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Agenda's ophalen
        run: python fetch.py
      - name: Pagina bouwen
        run: python build.py
      - name: Resultaat vastleggen
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add data state docs
          git diff --cached --quiet && echo "geen wijzigingen" || git commit -m "Agenda bijgewerkt $(date -u +%Y-%m-%d)"
          git push
