  notes: __NEXT_DATA__ met alle events (incl. tags, status, announcedAt)

- name: Bitterzoet
  city: Amsterdam
  capacity: 350
  url: https://www.bitterzoet.com/agenda/
  type: wp_event
  api: https://www.bitterzoet.com/wp-json/wp/v2/event?per_page=100
  max_pages: 2
  notes: API geeft alleen titel/URL; datum wordt van de eventpagina gelezen (gecached)

- name: Paradiso
  city: Amsterdam
  capacity: 1710
  url: https://www.paradiso.nl/
  type: sitemap_detail
  sitemap: https://www.paradiso.nl/sitemap.xml
  sitemap_pattern: "/sitemap/event_\\d+\\.xml"
  last_files: 60
  sitemap_recent_days: 120
  link_pattern: "paradiso\\.nl/programma/[^/]+/\\d+$"
  max_detail: 900
  detail_ttl_days: 30
  crawl_delay: 0.7
  notes: geen JSON-LD; eventdata zit in de React Server Components-payload van elke eventpagina. Sitemap event_*.xml (364 bestanden à 30 URL's) is op id gesorteerd, NIET op datum; daarom de laatste 60 bestanden lezen en alleen URL's houden met een lastmod in de laatste 120 dagen (aankomende events worden bijgewerkt). Eerste run zwaar, daarna gecached.

- name: Tolhuistuin
  city: Amsterdam
  capacity: 550
  url: https://tolhuistuin.nl/agenda
