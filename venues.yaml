# Poppodia die de agenda volgt.
#
# Een podium toevoegen = een blok met minimaal `name`, `city` en `url` (de agendapagina).
# Zonder `type` (of met type: auto) probeert de fetcher automatisch, in deze volgorde:
#   jsonld         schema.org Event-objecten op de agendapagina zelf
#   embedded       JSON in de pagina (__NEXT_DATA__, Angular ng-state, andere application/json)
#   tribe          The Events Calendar API (/wp-json/tribe/events/v1/events)
#   wp_event       WordPress REST API voor het event-posttype
#   jsonld_detail  eventlinks op de agendapagina volgen en per eventpagina de JSON-LD lezen
# Pas als dat niets oplevert hoef je zelf iets in te vullen: type: html + CSS-selectors (zie README).
#
# Optionele velden:
#   type          auto | jsonld | embedded | tribe | wp_event | json_api | stager | jsonld_detail | sitemap_detail | html | disabled
#                 stager = Stager-ticketshop-API (<podium>.stager.co): alle komende events met tijd, prijs en uitverkocht-status
#   api / items / fields / page_param   json_api: eigen JSON-eindpunt met veldafbeelding (zie fetch.strat_json_api)
#   only_genres   alleen events met een van deze genres/typen houden (bijv. [Muziek, Clubnacht])
#   time_is_local ISO-tijden van dit podium als Nederlandse lokale tijd lezen, ook al staat er +00:00/Z achter
#   sitemap / sitemap_pattern / last_files   voor sitemap_detail: sitemap-index, regex voor eventbestanden, hoeveel laatste bestanden
#   genre_taxonomies  wp_event: alleen deze WordPress-taxonomieën als genre gebruiken (bv. [production_genre])
#   lineup        CSS-selector op de eventpagina voor de line-up (artiestnamen), bv. ".accordion__title h2"
#   sitemap_recent_days   alleen sitemap-URL's met een lastmod in de laatste N dagen (aankomende events worden bijgewerkt)
#   detail_ttl_days  hoe lang een gelezen eventpagina in de cache blijft (standaard 10)
#   api           expliciete API-URL (tribe / wp_event)
#   list_pages    extra overzichtspagina's (bijv. paginering) voor jsonld_detail
#   list_pages_template / list_pages_max / list_pages_offset   paginering: URL met {n} (n=2,3,… + offset), tot 404 of geen nieuwe links
#   category_pages  eigen genre-/type-/locatiefilters van het podium als tagbron (zie fetch.category_tags en README)
#   extra_sources   lijst van extra bronnen voor hetzelfde podium, elk met eigen url/type (bv. de Stager-ticketshop); dubbelen worden samengevoegd
#   link_pattern  regex waaraan eventlinks moeten voldoen (jsonld_detail)
#   max_detail    max. aantal eventpagina's per run (jsonld_detail; standaard 400, gecached 10 dagen)
#   crawl_delay   seconden wachten tussen requests naar dit podium (standaard 1)
#   min_events    minimum aantal events voordat een strategie als geslaagd geldt (standaard 3)
#   item/title/date/link/genre/subtitle  CSS-selectors voor type: html
#   detail_date   CSS-selector van de datum op de eventpagina (als de tekst ook andere datums bevat)
#   group / group_date   type: html: datum staat als kop boven een groep kaarten (selector van de groep en van de datumkop)
#   facetwp: true        type: html met FacetWP 'laad meer' (JSON-POST met paged); wordt ook automatisch herkend
#   date_from_url true -> haal DD-MM-YYYY (of DD-MM-YY) uit de event-URL als datum ontbreekt
#   section       poppodium (standaard) | overig  -> 'overig' is alleen zichtbaar onder de knop 'Alles'
#   capacity      zaalcapaciteit (informatief, uit VNPF-overzicht)
#   notes         vrije opmerking, wordt niet gebruikt

