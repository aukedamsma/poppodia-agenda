# Genre-taxonomie van de Podiumagenda.
#
# Hoofdgenres: de genre-indeling van Bandcamp Discover (sept. 2026), zonder podcasts en audiobooks (geen live muziek),
# aangevuld met drie categorieën die in Nederlandse programmering onmisbaar zijn: Nederlandstalig, Feest / tribute en
# Overig. Eén bewuste afwijking: Bandcamps 'acoustic' valt hier onder Folk / singer-songwriter (in de praktijk dezelfde
# programmering). Labels zijn Nederlands waar dat natuurlijk klinkt (Wereldmuziek, Klassiek, Filmmuziek), Engels waar
# het vakjargon dat is (Indie, Hiphop, Ambient). Subgenres (verderop) volgen Bandcamp + RateYourMusic.
# Ruwe tags van podia blijven bewaard (event.genres); dit bestand bepaalt event.genre_norm en event.subgenres.
#
# Regels worden van boven naar beneden getest; de EERSTE regel die past wint. Zet daarom specifieke termen
# (pop-punk -> punk, indie-pop -> alternative, hardstyle -> electronic) vóór de generieke (pop, punk, hardcore).
# `match` zijn losse woorden/fragmenten (kleine letters, koppeltekens en spaties worden genegeerd bij het vergelijken).
# Onbekende tags komen in data/report.json onder `unknown_genres`, zodat je ze hier kunt toevoegen.

groups:
  electronic:     {label: Elektronisch,             desc: "electronica, house, techno, drum & bass, dubstep, trance, hardstyle, electro, IDM, synthwave"}
  rock:           {label: Rock,                     desc: "rock, hardrock, classic rock, psychedelica, prog, grunge, stoner, garage, rock-'n-roll"}
  metal:          {label: Metal,                    desc: "metal in alle varianten, metalcore, hardcore, grindcore, doom, sludge"}
  alternative:    {label: Alternative / indie,      desc: "indie, alternative, shoegaze, dream pop, post-rock, britpop, emo"}
  hiphop:         {label: Hiphop / rap,             desc: "hiphop, rap, trap, drill, grime, cloud rap, nederhop"}
  experimental:   {label: Experimenteel,            desc: "avant-garde, noise, industrial, sound art, krautrock, free improvisation"}
  punk:           {label: Punk,                     desc: "punk, post-punk, hardcore-punk, ska-punk, pop-punk, post-hardcore"}
  folk:           {label: Folk / singer-songwriter, desc: "folk, singer-songwriter, akoestisch, indie folk (Bandcamp: folk + acoustic)"}
  pop:            {label: Pop,                      desc: "pop, synthpop, k-pop, hyperpop, power pop"}
  ambient:        {label: Ambient,                  desc: "ambient, drone, soundscapes, dark ambient"}
  soundtrack:     {label: Filmmuziek / soundtrack,  desc: "filmmuziek, soundtracks, gamemuziek, live-scores"}
  world:          {label: Wereldmuziek,             desc: "afrobeats, amapiano, balkan, arabisch, aziatisch, flamenco, celtic"}
  jazz:           {label: Jazz,                     desc: "jazz, improvisatie, fusion, nu-jazz, bigband"}
  funk:           {label: Funk / disco,             desc: "funk, disco, boogie, italo-disco, groove"}
  soul:           {label: R&B / soul,               desc: "soul, r&b, neo-soul, motown"}
  devotional:     {label: Gospel / devotioneel,     desc: "gospel, worship, spirituele muziek"}
  classical:      {label: Klassiek,                 desc: "klassiek, kamermuziek, neoklassiek, oude muziek, opera, koor"}
  reggae:         {label: Reggae / ska,             desc: "reggae, dub, dancehall, ska, rocksteady"}
  country:        {label: Country / americana,      desc: "country, americana, bluegrass, alt-country, rockabilly"}
  spokenword:     {label: Spoken word / lezing,     desc: "spoken word, poëzie, lezing, talkshow, debat, podcast-opnames"}
  comedy:         {label: Comedy / cabaret,         desc: "stand-up, comedy, cabaret"}
  blues:          {label: Blues,                    desc: "blues, bluesrock, delta blues, boogie-woogie"}
  kids:           {label: Kinderen / familie,       desc: "kindervoorstellingen, familieconcerten"}
  latin:          {label: Latin,                    desc: "salsa, bachata, cumbia, reggaeton, braziliaans, flamenco"}
  nederlandstalig: {label: Nederlandstalig,         desc: "nederpop, levenslied, schlager, kleinkunst (nederhop -> hiphop)"}
  party:          {label: Feest / tribute,          desc: "tributebands, coverbands, decennia-feesten, bingo, quiz, karaoke, silent disco"}
  overig:         {label: Overig,                   desc: "alles wat niet in te delen is"}

# Volgorde is betekenisvol: eerste treffer wint.
rules:
  # --- eventtypes die geen muziekgenre zijn ---
  - {group: kids,          match: [kids, kinder, familie, family, jeugd, peuter, kleuter]}
  - {group: comedy,        match: [comedy, cabaret, stand-up, standup, stand up, improv comedy]}
  - {group: spokenword,    match: [lezing, talk, talkshow, podcast, spoken word, poezie, poetry, literatuur, debat, kennis & debat, kennis, college, filosof, boekpresentatie, quiz avond, voordracht, storytelling]}
